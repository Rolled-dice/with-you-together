<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>SomeoneNear</title>
  <!-- Two figures leaning toward one another, not quite touching.
       Colours are hardcoded here because a favicon is loaded outside the
       document and cannot read the app's CSS custom properties.
       Keep in sync with --color-orb-terracotta / --color-orb-navy. -->
  <g transform="rotate(5 20 58)" fill="#c4552f">
    <circle cx="20" cy="22" r="7"/>
    <path d="M13 58V38a7 7 0 0 1 14 0v20Z"/>
  </g>
  <g transform="rotate(-5 44 58)" fill="#1f3a57">
    <circle cx="44" cy="22" r="7"/>
    <path d="M37 58V38a7 7 0 0 1 14 0v20Z"/>
  </g>
</svg>
