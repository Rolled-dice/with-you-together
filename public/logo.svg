<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <title>SomeoneNear</title>
  <!-- Square viewBox on purpose: browsers letterbox a non-square favicon, so the
       112x72 mark is padded rather than stretched.
       Colours are hardcoded because a favicon loads outside the document and
       cannot read CSS custom properties. Sampled from the logo artwork; keep in
       sync with --color-orb-terracotta / --color-orb-navy. -->
  <g transform="translate(0 20)">
    <g fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#c05c3a" d="M12 60V38q0-12 12-12t11 12v6q0 10 13 10"/>
      <path stroke="#25435f" d="M100 60V38q0-12-12-12t-11 12v6q0 10-13 10"/>
    </g>
    <circle cx="26" cy="12" r="8.5" fill="#c05c3a"/>
    <circle cx="86" cy="12" r="8.5" fill="#25435f"/>
  </g>
</svg>
